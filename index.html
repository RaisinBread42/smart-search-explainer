/* ============================================================
   2. TEXT UTILITIES + MODELS
   ============================================================ */
const STOP = new Set(['the','a','an','and','or','for','with','of','to','in','on','at','is','it','that','this','from','your','any','all','as','by','be','are','set','new','used','great','full','like','more','most','out','up','plenty','assorted','everything','must','go']);

function tokenize(text){ return (text || '').toLowerCase().match(/[a-z0-9]+/g) || []; }
// category is included so concept words like "furniture" are searchable
function docText(item){ return `${item.title} ${item.description} ${item.metadata.join(' ')} ${item.category}`; }
function contentTokens(item){ return tokenize(docText(item)).filter((t) => !STOP.has(t) && t.length > 1); }

function normalize(v){
  let s = 0; for (const k in v) s += v[k]*v[k];
  s = Math.sqrt(s) || 1;
  const o = {}; for (const k in v) o[k] = v[k]/s;
  return o;
}
function addInto(target, vec, scale){ for (const k in vec) target[k] = (target[k] || 0) + vec[k]*scale; return target; }
function cosine(a, b){
  let dot = 0;
  const small = Object.keys(a).length < Object.keys(b).length ? a : b;
  const other = small === a ? b : a;
  for (const k in small) if (other[k]) dot += a[k]*b[k];
  return dot; // both normalized
}

// Build IDF, TF-IDF doc vectors, and co-occurrence ("distributional") term vectors.
function buildModel(items){
  const docToks = items.map(contentTokens);
  const df = {};
  docToks.forEach((ts) => { new Set(ts).forEach((t) => { df[t] = (df[t]||0)+1; }); });
  const N = items.length;
  const idf = {};
  // Smoothed IDF: log((N+1)/(df+1)) is the standard "add-one" smoothing (avoids
  // divide-by-zero and over-rewarding once-seen words on a tiny corpus); the
  // trailing +1 floor keeps every term's weight positive so common words still
  // count a little rather than dropping to zero.
  Object.keys(df).forEach((t) => { idf[t] = Math.log((N+1)/(df[t]+1)) + 1; });

  const tfidf = (toks) => {
    const tf = {};
    toks.forEach((t) => { if (idf[t] !== undefined) tf[t] = (tf[t]||0)+1; });
    const v = {};
    for (const t in tf) v[t] = (tf[t]/toks.length) * idf[t];
    return normalize(v);
  };

  // term co-occurrence vectors: words sharing a listing become "neighbors"
  const co = {};
  docToks.forEach((ts) => {
    const uniq = [...new Set(ts)];
    uniq.forEach((a) => {
      co[a] = co[a] || {};
      uniq.forEach((b) => { if (a !== b) co[a][b] = (co[a][b]||0) + idf[b]; });
      // Self-anchor (1.5×): a word is always its own strongest neighbor. Without
      // this, two words that never co-occur but share neighbors could outrank an
      // exact match. 1.5 keeps the literal term dominant while still allowing
      // synonyms to pull weight. (Tunable dial, not a magic constant.)
      co[a][a] = (co[a][a]||0) + idf[a]*1.5;
    });
  });
  const termVec = {};
  Object.keys(co).forEach((t) => { termVec[t] = normalize(co[t]); });

  // A document/query "embedding" = blend of two signals:
  //   • distributional (weight 1.0): the sum of its words' co-occurrence vectors
  //     — this is what lets "cheap" pull in "budget"/"affordable".
  //   • literal TF-IDF (weight 0.7): anchors the vector to the actual words typed
  //     so exact matches still rank highest.
  // The 1.0 / 0.7 ratio leans toward meaning while keeping literal matches honest;
  // it's the one dial most worth tuning per catalog. (A production system would
  // expose this as a hybrid-search weight — see the Takeaways slide.)
  const embed = (toks) => {
    const dist = {};
    toks.forEach((t) => { if (termVec[t]) addInto(dist, termVec[t], idf[t] || 1); });
    const v = {};
    addInto(v, normalize(dist), 1.0);
    addInto(v, tfidf(toks), 0.7);
    return normalize(v);
  };

  const docVectors = docToks.map(embed);
  return { df, idf, termVec, embed, docVectors, vocabSize: Object.keys(df).length };
}
const MODEL = buildModel(DATASET);

// The words the model "learned" are closest in meaning to a given word —
// i.e. the ones that keep the most similar company across the catalog.
function topNeighbors(word, k = 5){
  const tv = MODEL.termVec[word];
  if (!tv) return [];
  return Object.keys(MODEL.termVec)
    .filter((o) => o !== word && MODEL.df[o] >= 2)
    .map((o) => ({ word: o, sim: cosine(tv, MODEL.termVec[o]) }))
    .filter((r) => r.sim > 0.1)
    .sort((a, b) => b.sim - a.sim)
    .slice(0, k);
}

/* ============================================================
   3. SEARCH ALGORITHMS
   ============================================================ */
// Keyword: word matches in body + title matches x2, normalized; phrase bonus.
function keywordSearch(query){
  const qWords = [...new Set(tokenize(query).filter((w) => !STOP.has(w)))];
  if (qWords.length === 0) return [];
  const phrase = query.trim().toLowerCase();

  return DATASET.map((item) => {
    const titleToks = new Set(tokenize(item.title));
    const bodyToks = new Set(tokenize(`${item.description} ${item.metadata.join(' ')} ${item.category}`));
    const matched = [];
    let titleHits = 0, bodyHits = 0;
    qWords.forEach((w) => {
      if (titleToks.has(w)) { titleHits++; matched.push({ word: w, where: 'title' }); }
      else if (bodyToks.has(w)) { bodyHits++; matched.push({ word: w, where: 'body' }); }
    });
    let raw = (bodyHits + titleHits*2) / (qWords.length*2);
    const phraseHit = phrase.length > 2 &&
      (item.title.toLowerCase().includes(phrase) || item.description.toLowerCase().includes(phrase));
    if (phraseHit) raw = Math.min(1, raw + 0.25);
    return { item, score: Math.round(Math.min(1, raw)*100), matched, phraseHit };
  })
  .filter((r) => r.score > 0)
  .sort((a, b) => b.score - a.score);
}

// Semantic: cosine similarity between blended distributional embeddings.
function semanticSearch(query){
  const qToks = tokenize(query).filter((w) => !STOP.has(w) && w.length > 1);
  if (qToks.length === 0) return [];
  const qVec = MODEL.embed(qToks);
  if (Object.keys(qVec).length === 0) return [];

  return DATASET.map((item, i) => {
    const dVec = MODEL.docVectors[i];
    const sim = cosine(qVec, dVec);
    // contributions = which shared/related terms drove the score (for "why ranked")
    const contrib = [];
    for (const k in qVec) { if (dVec[k]) contrib.push({ term: k, w: qVec[k]*dVec[k] }); }
    contrib.sort((a, b) => b.w - a.w);
    const related = contrib.slice(0, 4).map((c) => ({ term: c.term, literal: qToks.includes(c.term) }));
    return { item, score: Math.round(sim*100), sim, related };
  })
  .filter((r) => r.score > 0)
  .sort((a, b) => b.score - a.score);
}

function highlight(text, words){
  if (!words || words.length === 0) return text;
  const re = new RegExp(`\\b(${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`, 'gi');
  return text.split(re).map((p, i) =>
    words.some((w) => w.toLowerCase() === p.toLowerCase())
      ? <mark key={i} className="bg-green-200 text-green-900 rounded px-0.5 font-semibold">{p}</mark>
      : <span key={i}>{p}</span>
  );
}

        ))}

    </div>
  );
}

function useSearch(searchFn){
  const [query, setQuery] = useState('');
  const [results, setResults] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [ran, setRan] = useState('');
  const timer = useRef(null);
  const run = (override) => {
    const q = typeof override === 'string' ? override : query;
    if (!q.trim()) { setResults(null); return; }
    setScanning(true); setResults(null); setRan(q);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { setResults(searchFn(q).slice(0, 5)); setScanning(false); }, 600);
  };
  useEffect(() => () => clearTimeout(timer.current), []);
  return { query, setQuery, results, scanning, ran, run };
}

function CosineVisual(){

  const rad = angle * Math.PI / 180;
  const cx = 150, cy = 170, len = 120;
  // query vector fixed pointing up-right; doc vector rotates by `angle` away from it
  const baseAngle = -60 * Math.PI / 180;
  const qx = cx + len*Math.cos(baseAngle), qy = cy + len*Math.sin(baseAngle);
  const dAngle = baseAngle + rad;
  const dx = cx + len*Math.cos(dAngle), dy = cy + len*Math.sin(dAngle);
  const sim = Math.round(Math.cos(rad)*100);
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-5">

        <line x1={cx} y1={cy} x2={qx} y2={qy} stroke="#10b981" strokeWidth="3" markerEnd="url(#ah-e)" />
        <line x1={cx} y1={cy} x2={dx} y2={dy} stroke="#6366f1" strokeWidth="3" markerEnd="url(#ah-i)" />
        <path d={`M ${cx+38*Math.cos(baseAngle)} ${cy+38*Math.sin(baseAngle)} A 38 38 0 0 1 ${cx+38*Math.cos(dAngle)} ${cy+38*Math.sin(dAngle)}`} fill="none" stroke="#94a3b8" strokeWidth="2" />
        <text x={cx+58*Math.cos(baseAngle+rad/2)} y={cy+58*Math.sin(baseAngle+rad/2)} fontSize="13" fill="#64748b" fontWeight="700" textAnchor="middle">θ</text>
        <text x={qx} y={qy-8} fontSize="12" fill="#059669" fontWeight="700" textAnchor="middle">query</text>
        <text x={dx} y={dy-8} fontSize="12" fill="#4f46e5" fontWeight="700" textAnchor="middle">listing</text>
        <circle cx={cx} cy={cy} r="4" fill="#0f172a" />
        <defs>
          <marker id="ah-e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/></marker>
          <marker id="ah-i" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6366f1"/></marker>
        </defs>
      </svg>
      <input type="range" min="0" max="90" value={angle} onChange={(e) => setAngle(+e.target.value)} className="w-full accent-emerald-600 mt-3" />
      <div className="flex items-baseline justify-between mt-2">
        <span className="text-sm text-slate-400 tabular-nums">θ = {angle}°</span>

  );
}

function Comparison(){
  const [query, setQuery] = useState('');
  const [active, setActive] = useState('');
  const kw = useMemo(() => active ? keywordSearch(active).slice(0, 5) : [], [active]);
  const sem = useMemo(() => active ? semanticSearch(active).slice(0, 5) : [], [active]);
  const kwIds = kw.map((r) => r.item.id);
  const semIds = sem.map((r) => r.item.id);
  const onlySemantic = sem.filter((r) => !kwIds.includes(r.item.id)).length;

  const chartData = useMemo(() => {
    const map = new Map();
    kw.forEach((r) => map.set(r.item.id, { name: r.item.title.slice(0, 20), keyword: r.score, semantic: 0 }));
    sem.forEach((r) => {
      const e = map.get(r.item.id) || { name: r.item.title.slice(0, 20), keyword: 0, semantic: 0 };
      e.semantic = r.score; map.set(r.item.id, e);
    });
    return [...map.values()].sort((a, b) => (b.keyword+b.semantic)-(a.keyword+a.semantic)).slice(0, 6);
  }, [active]);

  const run = (override) => setActive(typeof override === 'string' ? override : query);

  return (
    <SlideShell>
      <div className="flex-1 flex flex-col max-w-6xl mx-auto w-full px-6 overflow-hidden">
        <h2 className="text-3xl font-bold text-slate-900 mb-1">Side-by-Side</h2>
        <p className="text-slate-500 text-sm mb-4">One query, both engines. <span className="text-slate-400">Tip: try "affordable furniture" — watch keyword scatter across categories while semantic stays on-concept.</span></p>
        <SearchBox query={query} setQuery={setQuery} onSearch={run} accent="indigo" examples={EXAMPLES.compare} />

        <div className="flex-1 overflow-y-auto mt-4 pr-1">
          {!active && <div className="text-center py-16 text-slate-400">Pick a query above to compare both engines side-by-side.</div>}
          {active && (
          <>
          <div className="grid md:grid-cols-2 gap-4">
            <div>
              <div className="flex items-center gap-2 mb-2 text-indigo-700 font-semibold text-sm"><span>🔤</span> Keyword — top 5</div>
              <div className="space-y-2">
                {kw.length === 0 && <div className="text-sm text-slate-400 bg-white border rounded-lg p-4">No literal matches.</div>}
                {kw.map((r, i) => <CompactRow key={r.item.id} rank={i+1} item={r.item} score={r.score} accent="indigo" unique={!semIds.includes(r.item.id)} />)}
              </div>
            </div>
            <div>
              <div className="flex items-center gap-2 mb-2 text-emerald-700 font-semibold text-sm"><span>🧠</span> Semantic — top 5</div>
              <div className="space-y-2">
                {sem.map((r, i) => <CompactRow key={r.item.id} rank={i+1} item={r.item} score={r.score} accent="emerald" unique={!kwIds.includes(r.item.id)} />)}
              </div>
            </div>
          </div>

          <div className="mt-5 bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="text-sm font-semibold text-slate-700 mb-3">Score comparison</h3>
            <div style={{ width: '100%', height: 300 }}>
              <ResponsiveContainer>
                <BarChart data={chartData} margin={{ top: 18, right: 10, left: -8, bottom: 60 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e8edf3" vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 10, fill: '#64748b' }} interval={0} angle={-18} textAnchor="end" height={70} />
                  <YAxis domain={[0, 100]} tick={{ fontSize: 11, fill: '#64748b' }} />
                  <Tooltip cursor={{ fill: 'rgba(99,102,241,0.06)' }} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="keyword" name="Keyword" fill="#6366f1" radius={[4,4,0,0]} animationDuration={800}>
                    <LabelList dataKey="keyword" position="top" fontSize={10} fill="#6366f1" formatter={(v) => v ? v : ''} />
                  </Bar>
                  <Bar dataKey="semantic" name="Semantic" fill="#10b981" radius={[4,4,0,0]} animationDuration={800}>
                    <LabelList dataKey="semantic" position="top" fontSize={10} fill="#10b981" formatter={(v) => v ? v : ''} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div className="mt-4 grid md:grid-cols-3 gap-3">
            <div className="md:col-span-2 bg-violet-50 border border-violet-200 rounded-xl p-4 text-sm text-violet-900">
              <strong>Why they differ:</strong> Keyword ranks by literal word overlap, so it rewards any listing repeating your terms — even from the wrong category. Semantic ranks by meaning, so for this query it surfaced <strong>{onlySemantic}</strong> listing{onlySemantic !== 1 ? 's' : ''} keyword ranked differently or missed (tagged <span className="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-600 text-white">SEMANTIC ONLY</span>).
            </div>
            <div className="bg-slate-900 rounded-xl p-4 text-sm text-slate-200">
              <p className="text-[11px] uppercase tracking-wide text-indigo-300 font-semibold mb-1">Field note</p>
              <p>Clients typically see fewer “no results found” dead-ends and longer sessions after adding a semantic layer.</p>
            </div>
          </div>
          </>
          )}
        </div>
      </div>
    </SlideShell>
  );
}

}

        <div className="flex-1 overflow-y-auto mt-5 pr-1">
          {!s.scanning && s.results === null && (
            <div className="text-center py-14 text-slate-400">
              Try a misspelling like <span className="font-mono bg-slate-100 px-1 rounded">mirorless camra</span> — both engines come up empty.
            </div>
          )}
          {s.scanning && <Scanning accent="indigo" />}
          {!s.scanning && s.results && s.results[0] && (() => {
            const { kw, sem } = s.results[0];
            const bothEmpty = kw.length === 0 && sem.length === 0;
            return (
              <div className="animate-scanIn">
                <div className="grid md:grid-cols-2 gap-4">
                  <ResultCol title="🔤 Keyword" rows={kw} accent="indigo" />
                  <ResultCol title="🧠 Semantic" rows={sem} accent="emerald" />
                </div>
                <div className={`mt-5 rounded-xl p-4 text-sm border ${bothEmpty ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                  {bothEmpty
                    ? <><strong>Both returned nothing.</strong> Neither engine “knows” a misspelled or absent word — they only relate words that actually appear in the catalog. Real neural embeddings, trained on billions of sentences, handle typos and rare synonyms far better. The fix in practice: spell-correction + a true embedding model.</>
                    : <><strong>Notice the difference even here.</strong> Semantic still leans on co-occurring words, so it degrades more gracefully — but it's not magic. Garbage in, sparse out.</>}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    </SlideShell>
  );
}

  cohere:       { name: 'Cohere',         domain: 'cohere.com',     color: '#39594d', url: 'https://docs.cohere.com/docs/embeddings' },
  pinecone:     { name: 'Pinecone',       domain: 'pinecone.io',    color: '#1b17f5', url: 'https://www.pinecone.io' },
  supabase:     { name: 'Supabase',       domain: 'supabase.com',   color: '#3ecf8e', url: 'https://supabase.com/docs/guides/ai' },
  pgvector:     { name: 'pgvector',       domain: 'postgresql.org', color: '#336791', url: 'https://github.com/pgvector/pgvector' },
  qdrant:       { name: 'Qdrant',         domain: 'qdrant.tech',    color: '#dc244c', url: 'https://qdrant.tech' },
};

function ToolLogo({ t, compact }){
  const [err, setErr] = useState(false);
  const icon = (t.domain && !err)
    ? <img src={`https://www.google.com/s2/favicons?domain=${t.domain}&sz=64`} onError={() => setErr(true)}
        alt={t.name} title={t.name} loading="lazy" className="w-5 h-5 rounded-sm" />
    : <span title={t.name} style={{ backgroundColor: t.color }}
        className="w-5 h-5 rounded-sm grid place-items-center text-white text-[11px] font-bold leading-none">{t.name[0]}</span>;
  const inner = compact
    ? <span title={t.name} className="inline-grid place-items-center w-8 h-8 rounded-md bg-white border border-slate-200 hover:border-slate-300 transition-colors">{icon}</span>
    : <span className="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-full pl-1.5 pr-3 py-1 text-sm font-medium text-slate-700 hover:border-slate-300 hover:text-slate-900 transition-colors">{icon}{t.name}</span>;
  if (!t.url) return inner;
  return <a href={t.url} target="_blank" rel="noopener noreferrer" title={`${t.name} — open site`}>{inner}</a>;
}
const PIPE_INTERFACE = [
  { fn: 'prepare(doc)',   out: 'text',            swap: false },
  { fn: 'embed(text)',    out: 'representation',  swap: true  },
  { fn: 'store(reps)',    out: 'index',           swap: false },
  { fn: 'search(query)',  out: 'ranked results',  swap: false },
];

function BuildPipeline(){
  const [sel, setSel] = useState(null); // focused tier column, or null = show all equally
  const stages = [
    { n: '1', label: 'Prepare',   hint: 'same every tier', get: () => 'Clean the text; skip chunking for short items.', emphasize: false },
    { n: '2', label: 'Represent', hint: '← the choice',    get: (ti) => ti.represent, emphasize: true },
    { n: '3', label: 'Store',     hint: 'follows from it',  get: (ti) => ti.store,     emphasize: false },
    { n: '4', label: 'Search',    hint: 'follows from it',  get: (ti) => ti.query,     emphasize: false },
  ];
  const dim = (idx) => (sel !== null && sel !== idx ? 'opacity-40' : '');
  const GRID = 'grid grid-cols-[150px_repeat(4,minmax(0,1fr))] gap-2.5 min-w-[1000px]';
  return (
    <SlideShell>
      <div className="flex-1 flex flex-col justify-center max-w-[1400px] mx-auto w-full px-8 overflow-y-auto py-2">
        <h2 className="text-4xl font-bold text-slate-900 mb-2">Build your own: one pipeline, swappable parts</h2>
        <p className="text-slate-500 mb-5 text-base">The same four steps power <em>every</em> search system. Read a <strong>row</strong> to see how each tier implements that step; read a <strong>column</strong> to build one tier top-to-bottom. The pipeline shape never changes — only the cells do. <span className="text-slate-400">(Click a tier to focus its column.)</span></p>
        <div className="overflow-x-auto pb-1">
          <div className={GRID}>
            {/* corner + tier headers */}
            <div />
            {TIERS.map((ti, idx) => {
              const on = sel === idx;
              return (
                <button key={ti.key} onClick={() => setSel(on ? null : idx)}
                  className={`text-left rounded-xl p-3.5 border-2 transition-all ${dim(idx)} ${on ? `border-${ti.color}-500 bg-${ti.color}-50` : `border-${ti.color}-200 bg-white hover:border-${ti.color}-300`}`}>
                  <div className="flex items-baseline gap-1.5">
                    <span className={`text-xs font-bold text-${ti.color}-600`}>TIER {ti.key}</span>
                    <span className="text-[11px] text-slate-400 truncate">{ti.tag}</span>
                  </div>
                  <div className="text-lg font-bold text-slate-800 leading-tight mt-0.5">{ti.name}</div>
                  <div className="mt-2">
                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${ti.backend ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700'}`}>{ti.backend ? '⚙ backend' : '✓ static'} · {ti.cost}</span>
                  </div>
                  <div className="mt-2.5 flex flex-wrap gap-1.5">
                    {ti.tools.length > 0
                      ? ti.tools.map((k) => <ToolLogo key={k} t={TOOLS[k]} compact />)
                      : <span className="text-xs text-slate-400">no library</span>}
                  </div>
                </button>
              );
            })}
            {/* stage rows */}
            {stages.map((st) => (
              <React.Fragment key={st.n}>
                <div className={`rounded-xl p-3 flex flex-col justify-center ${st.emphasize ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  <div className="flex items-center gap-1.5">
                    <span className={`w-6 h-6 rounded-full text-xs leading-6 text-center font-bold ${st.emphasize ? 'bg-white text-slate-800' : 'bg-slate-300 text-slate-600'}`}>{st.n}</span>
                    <span className="text-base font-bold">{st.label}</span>
                  </div>
                  <span className={`text-xs mt-1 ${st.emphasize ? 'text-amber-300 font-semibold' : 'text-slate-400'}`}>{st.hint}</span>
                </div>
                {TIERS.map((ti, idx) => (
                  <div key={ti.key} className={`rounded-xl p-3.5 border text-sm leading-relaxed transition-all flex items-center ${dim(idx)} ${st.emphasize ? `bg-${ti.color}-50 border-${ti.color}-200 text-slate-700` : 'bg-white border-slate-200 text-slate-600'}`}>
                    {st.get(ti)}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        </div>
        {/* code interface capstone */}
        <div className="bg-slate-900 rounded-xl p-5 mt-4 font-mono text-[15px] leading-relaxed overflow-x-auto">
          {PIPE_INTERFACE.map((l) => (
            <div key={l.fn} className="whitespace-nowrap">
              <span className={l.swap ? 'text-violet-300 font-bold' : 'text-slate-300'}>{l.fn}</span>
              <span className="text-slate-500"> → </span>
              <span className="text-slate-400">{l.out}</span>
              {l.swap && <span className="text-violet-400">{'   // ← pick this; store + search follow'}</span>}
            </div>
          ))}
        </div>
      </div>
    </SlideShell>
  );
}

function TierMatrix(){
  return (
    <SlideShell>
      <div className="flex-1 flex flex-col max-w-6xl mx-auto w-full px-6 overflow-y-auto py-1">
        <h2 className="text-3xl font-bold text-slate-900 mb-1">Four tiers — and the one line that splits them</h2>
        <p className="text-slate-500 mb-4 text-sm">The real decision isn’t “how much does it cost?” — embeddings are pennies at this scale. It’s <strong>“can this stay a static site, or do I now need a backend?”</strong></p>
        <div className="grid md:grid-cols-4 gap-3">
          {TIERS.map((ti) => (
            <div key={ti.key} className={`rounded-2xl border-2 border-${ti.color}-200 bg-white p-4 flex flex-col`}>
              <div className="flex items-baseline gap-1.5">
                <span className={`text-xs font-bold text-${ti.color}-600`}>TIER {ti.key}</span>
                <span className="text-[10px] text-slate-400">{ti.tag}</span>
              </div>
              <h3 className="text-base font-bold text-slate-800 mt-0.5">{ti.name}</h3>
              <div className="mt-2 flex flex-wrap gap-1">
                <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${ti.backend ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700'}`}>{ti.backend ? 'needs backend' : 'static, no keys'}</span>
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">{ti.cost}</span>
              </div>
              <p className="text-xs text-emerald-700 mt-3 flex gap-1.5"><span>✓</span><span>{ti.good}</span></p>
              <p className="text-xs text-rose-600 mt-1.5 flex gap-1.5"><span>✗</span><span>{ti.bad}</span></p>
              <div className="mt-auto pt-3">
                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1.5 pt-2 border-t border-slate-100">Reach for</p>
                {ti.tools.length > 0
                  ? <div className="flex flex-wrap gap-1.5">{ti.tools.map((k) => <ToolLogo key={k} t={TOOLS[k]} compact />)}</div>
                  : <p className="text-[11px] text-slate-400">{ti.libsNote}</p>}
              </div>
            </div>
          ))}
        </div>
        <div className="mt-4 grid md:grid-cols-2 gap-3">
          <div className="rounded-xl bg-green-50 border border-green-200 p-4">
            <p className="text-sm font-bold text-green-800">◀ Tiers 0–2 · Static</p>
            <p className="text-xs text-green-900/80 mt-1">Ship to GitHub Pages / Netlify / Vercel for free. No server, no secrets, no ops — and it covers the large majority of small-to-mid sites.</p>
          </div>
          <div className="rounded-xl bg-amber-50 border border-amber-200 p-4">
            <p className="text-sm font-bold text-amber-800">Tier 3 · Backend ▶</p>
            <p className="text-xs text-amber-900/80 mt-1">API keys can’t live in the browser, so you add a serverless function + a vector DB. Worth it for millions of items, a shared always-fresh index, or rich metadata filters.</p>
          </div>
        </div>
      </div>
    </SlideShell>
  );
}

function PickAndShip(){
  const steps = [
    { q: 'Users search exact terms — SKUs, names, model numbers?', yes: 'Tier 1 keyword is plenty. Ship it.', color: 'indigo' },
    { q: 'Need to match meaning / synonyms, catalog under ~50k items?', yes: 'Tier 2 browser embeddings — semantic, still $0, still static.', color: 'emerald' },
    { q: 'Millions of items, a shared index, or heavy filtering?', yes: 'Tier 3 managed vector DB — accept the backend.', color: 'violet' },
  ];
  return (
    <SlideShell>
      <div className="flex-1 flex flex-col justify-center max-w-4xl mx-auto w-full px-6 overflow-y-auto py-2">
        <h2 className="text-3xl font-bold text-slate-900 mb-1 text-center">Which do you actually pick?</h2>
        <p className="text-slate-500 mb-5 text-sm text-center">Walk down until you hit your first “yes.” Most sites stop in the top two.</p>
        <div className="space-y-3">
          {steps.map((s, i) => (
            <div key={i} className={`rounded-xl bg-white border border-slate-200 border-l-4 border-l-${s.color}-500 p-4 flex gap-3 items-start`}>
              <span className={`shrink-0 w-7 h-7 rounded-full bg-${s.color}-100 text-${s.color}-700 font-bold grid place-items-center text-sm`}>{i+1}</span>
              <div>
                <p className="text-sm font-semibold text-slate-800">{s.q}</p>
                <p className={`text-sm text-${s.color}-700 mt-0.5`}>→ {s.yes}</p>
              </div>
            </div>
          ))}
        </div>
        <div className="mt-5 bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white text-center">
          <p className="text-base font-bold">💡 You don’t have to choose just one</p>
          <p className="text-sm text-indigo-100 mt-1.5 max-w-2xl mx-auto">Because every tier shares the same <span className="font-mono bg-white/15 px-1 rounded">prepare → embed → store → search</span> shape, you can run keyword <em>and</em> semantic side by side and fuse their scores — the hybrid approach from the takeaways slide. Start at Tier 1, add Tier 2 beside it, blend. No rewrite.</p>
        </div>
      </div>
    </SlideShell>
  );
}

const SLIDES = [
  { title: 'Title & Intro', render: () => <SlideTitle /> },
  { title: 'Why It Matters', render: () => <WhyItMatters /> },
  { title: 'How Keyword Search Works', render: () => <ExplainKeyword /> },
  { title: 'Keyword Search — Live', render: () => <DemoKeyword /> },
  { title: 'How Semantic Search Works', render: () => <ExplainSemantic /> },
  { title: 'Semantic Search — Live', render: () => <DemoSemantic /> },
  { title: 'Side-by-Side Comparison', render: () => <Comparison /> },
  { title: "When Semantic Isn't Magic", render: () => <FailureCase /> },
  { title: 'Key Takeaways', render: () => <Takeaways /> },
  { title: 'Build Your Own — The Pipeline', render: () => <BuildPipeline /> },
  { title: 'Build Your Own — Pick a Tier', render: () => <TierMatrix /> },
  { title: 'Build Your Own — Which to Pick', render: () => <PickAndShip /> },
  { title: 'Work With Us', render: () => <CTA /> },
];

/* ============================================================
   6. APP SHELL + NAVIGATION
   ============================================================ */
function App(){
  const [i, setI] = useState(0);
  const next = () => setI((v) => Math.min(SLIDES.length-1, v+1));
  const prev = () => setI((v) => Math.max(0, v-1));

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="h-full flex flex-col bg-gradient-to-b from-slate-50 to-slate-100">
      {/* Persistent top bar: brand + keyboard hint + always-on contact */}
      <div className="flex-none flex items-center justify-between px-4 sm:px-6 pt-3">
        <span className="inline-flex items-center gap-1.5 font-semibold text-slate-700 text-sm">
          <span className="text-indigo-600">◆</span>{BRAND.name}
        </span>
        <span className="hidden sm:inline text-[11px] text-slate-400">use ← → to navigate</span>
        <a href={bookHref} className="text-xs font-medium text-indigo-600 hover:text-indigo-800 hover:underline">Book a call →</a>
      </div>
      <div className="flex-none flex items-center justify-center gap-1.5 pt-2">
        {SLIDES.map((s, idx) => (
          <button key={idx} onClick={() => setI(idx)} title={s.title}
            aria-label={`Go to slide ${idx+1}: ${s.title}`}
            className={`h-1.5 rounded-full transition-all ${idx === i ? 'w-8 bg-indigo-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}`} />
        ))}
      </div>

      <main className="flex-1 overflow-hidden py-3">{SLIDES[i].render()}</main>

      <footer className="flex-none border-t border-slate-200 bg-white/70 backdrop-blur px-6 py-3 flex items-center justify-between gap-4">
        <button onClick={prev} disabled={i === 0}
          className="px-5 py-2 rounded-lg font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">← Previous</button>
        <div className="text-center min-w-0">
          <div className="text-sm font-semibold text-slate-700 truncate">{SLIDES[i].title}</div>
          <div className="text-xs text-slate-400 flex items-center justify-center gap-1.5">
            Slide {i+1} of {SLIDES.length}
            <span className="text-slate-300">·</span>
            <span className="inline-flex items-center gap-1 text-slate-500 font-medium"><span className="text-indigo-500">◆</span>{BRAND.name}</span>
          </div>
        </div>
        <button onClick={next} disabled={i === SLIDES.length-1}
          className="px-5 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">{i === SLIDES.length-1 ? 'Done' : 'Next →'}</button>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
