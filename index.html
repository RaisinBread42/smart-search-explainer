/* ============================================================
   2. TEXT UTILITIES + EMBEDDINGS (TF-IDF, deterministic)
   ============================================================ */
const STOP = new Set(['the','a','an','and','or','for','with','of','to','in','on','at','is','it','that','this','from','your','any','all','as','by','be','are']);

function tokenize(text) {
  return (text || '').toLowerCase().match(/[a-z0-9]+/g) || [];
}
function docText(item) {
  return `${item.title} ${item.description} ${item.metadata.join(' ')}`;
}

// Build vocabulary + IDF across the corpus (deterministic)
function buildModel(items) {
  const df = {};                       // document frequency
  const docTokens = items.map((it) => {
    const toks = tokenize(docText(it)).filter((t) => !STOP.has(t) && t.length > 1);
    const seen = new Set(toks);
    seen.forEach((t) => { df[t] = (df[t] || 0) + 1; });
    return toks;
  });
  const vocab = Object.keys(df);
  const idf = {};
  const N = items.length;
  vocab.forEach((t) => { idf[t] = Math.log((N + 1) / (df[t] + 1)) + 1; });

  // TF-IDF vector for a token list, restricted to known vocab
  const vectorize = (toks) => {
    const tf = {};
    toks.forEach((t) => { if (idf[t] !== undefined) tf[t] = (tf[t] || 0) + 1; });
    const vec = {};
    let norm = 0;
    Object.keys(tf).forEach((t) => {
      const w = (tf[t] / toks.length) * idf[t];
      vec[t] = w; norm += w * w;
    });
    norm = Math.sqrt(norm) || 1;
    Object.keys(vec).forEach((t) => { vec[t] /= norm; });
    return vec;
  };

  const docVectors = docTokens.map(vectorize);
  return { idf, vectorize, docVectors };
}

function cosine(a, b) {
  let dot = 0;
  const keys = Object.keys(a).length < Object.keys(b).length ? a : b;
  for (const k in keys) { if (a[k] && b[k]) dot += a[k] * b[k]; }
  return dot; // vectors are already normalized
}

const MODEL = buildModel(DATASET);

/* ============================================================
   3. SEARCH ALGORITHMS
   ============================================================ */
// Keyword: word matches in description + title matches x2, normalized by query words.
function keywordSearch(query) {
  const qWords = [...new Set(tokenize(query).filter((w) => !STOP.has(w)))];
  if (qWords.length === 0) return [];
  const phrase = query.trim().toLowerCase();

  return DATASET.map((item) => {
    const titleToks = new Set(tokenize(item.title));
    const bodyToks = new Set(tokenize(`${item.description} ${item.metadata.join(' ')}`));
    const matched = [];
    let titleHits = 0, bodyHits = 0;

    qWords.forEach((w) => {
      const inTitle = titleToks.has(w);
      const inBody = bodyToks.has(w);
      if (inTitle) { titleHits++; matched.push({ word: w, where: 'title' }); }
      else if (inBody) { bodyHits++; matched.push({ word: w, where: 'body' }); }
    });

    // weighted: title hits count double
    let raw = (bodyHits + titleHits * 2) / (qWords.length * 2);
    // exact phrase bonus
    const phraseHit = phrase.length > 2 &&
      (item.title.toLowerCase().includes(phrase) || item.description.toLowerCase().includes(phrase));
    if (phraseHit) raw = Math.min(1, raw + 0.25);

    return { item, score: Math.round(Math.min(1, raw) * 100), matched, phraseHit };
  })
  .filter((r) => r.score > 0)
  .sort((a, b) => b.score - a.score);
}

// Semantic: cosine similarity between query TF-IDF vector and doc vectors.
function semanticSearch(query) {
  const qToks = tokenize(query).filter((w) => !STOP.has(w));
  if (qToks.length === 0) return [];
  const qVec = MODEL.vectorize(qToks);
  if (Object.keys(qVec).length === 0) return [];

  return DATASET.map((item, i) => {
    const sim = cosine(qVec, MODEL.docVectors[i]);
    return { item, score: Math.round(sim * 100), sim };
  })
  .filter((r) => r.score > 0)
  .sort((a, b) => b.score - a.score);
}

function highlight(text, words) {
  if (!words || words.length === 0) return text;
  const re = new RegExp(`\\b(${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`, 'gi');
  const parts = text.split(re);
  return parts.map((p, i) =>
    words.some((w) => w.toLowerCase() === p.toLowerCase())
      ? <mark key={i} className="bg-green-200 text-green-900 rounded px-0.5 font-semibold">{p}</mark>
      : <span key={i}>{p}</span>
  );
}

      <p className="text-sm text-slate-400">Scanning {DATASET.length} items…</p>
    </div>
  );
}

// Hook that runs a search with a brief scan animation
function useSearch(searchFn) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState(null);
  const [scanning, setScanning] = useState(false);
  const timer = useRef(null);

  const run = (override) => {
    const q = typeof override === 'string' ? override : query;
    if (!q.trim()) { setResults(null); return; }
    setScanning(true);
    setResults(null);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      setResults(searchFn(q).slice(0, 5));
      setScanning(false);
    }, 650);
  };
  useEffect(() => () => clearTimeout(timer.current), []);
  return { query, setQuery, results, scanning, run };
}

function Comparison() {
  const [query, setQuery] = useState(EXAMPLES[1]);
  const [active, setActive] = useState(EXAMPLES[1]);
  const kw = useMemo(() => keywordSearch(active).slice(0, 5), [active]);
  const sem = useMemo(() => semanticSearch(active).slice(0, 5), [active]);

  const chartData = useMemo(() => {
    // union of top items, show both scores
    const map = new Map();
    kw.forEach((r) => map.set(r.item.id, { name: r.item.title.slice(0, 22), keyword: r.score, semantic: 0 }));
    sem.forEach((r) => {
      const e = map.get(r.item.id) || { name: r.item.title.slice(0, 22), keyword: 0, semantic: 0 };
      e.semantic = r.score; map.set(r.item.id, e);
    });
    return [...map.values()].sort((a, b) => (b.keyword + b.semantic) - (a.keyword + a.semantic)).slice(0, 6);
  }, [active]);

  const kwIds = kw.map((r) => r.item.id);
  const semIds = sem.map((r) => r.item.id);
  const onlySemantic = sem.filter((r) => !kwIds.includes(r.item.id)).length;

  const run = (override) => setActive(typeof override === 'string' ? override : query);

  return (
    <SlideShell>
      <div className="flex-1 flex flex-col max-w-6xl mx-auto w-full px-6 overflow-hidden">
        <h2 className="text-3xl font-bold text-slate-900 mb-1">Side-by-Side</h2>
        <p className="text-slate-500 text-sm mb-4">One query, both engines. Watch the rankings diverge.</p>
        <SearchBox query={query} setQuery={setQuery} onSearch={run} accent="indigo" />

        <div className="flex-1 overflow-y-auto mt-4 pr-1">
          <div className="grid md:grid-cols-2 gap-4">
            {/* Keyword column */}
            <div>
              <div className="flex items-center gap-2 mb-2 text-indigo-700 font-semibold text-sm"><span>🔤</span> Keyword — top 5</div>
              <div className="space-y-2">
                {kw.length === 0 && <div className="text-sm text-slate-400 bg-white border rounded-lg p-4">No literal matches.</div>}
                {kw.map((r, i) => (
                  <CompactRow key={r.item.id} rank={i+1} item={r.item} score={r.score} accent="indigo" unique={!semIds.includes(r.item.id)} />
                ))}
              </div>
            </div>
            {/* Semantic column */}
            <div>
              <div className="flex items-center gap-2 mb-2 text-emerald-700 font-semibold text-sm"><span>🧠</span> Semantic — top 5</div>
              <div className="space-y-2">
                {sem.map((r, i) => (
                  <CompactRow key={r.item.id} rank={i+1} item={r.item} score={r.score} accent="emerald" unique={!kwIds.includes(r.item.id)} />
                ))}
              </div>
            </div>
          </div>

          {/* Chart */}
          <div className="mt-5 bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="text-sm font-semibold text-slate-700 mb-3">Score comparison</h3>
            <div style={{ width: '100%', height: 240 }}>
              <ResponsiveContainer>
                <BarChart data={chartData} margin={{ top: 5, right: 10, left: -10, bottom: 5 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#eef2f7" />
                  <XAxis dataKey="name" tick={{ fontSize: 10 }} interval={0} angle={-12} textAnchor="end" height={50} />
                  <YAxis domain={[0, 100]} tick={{ fontSize: 11 }} />
                  <Tooltip />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="keyword" name="Keyword" fill="#6366f1" radius={[3,3,0,0]} />
                  <Bar dataKey="semantic" name="Semantic" fill="#10b981" radius={[3,3,0,0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div className="mt-4 bg-violet-50 border border-violet-200 rounded-xl p-4 text-sm text-violet-900">
            <strong>Why they differ:</strong> Keyword search ranks by literal word overlap, so it rewards titles that repeat your exact terms.
            Semantic search ranks by meaning — for this query it surfaced <strong>{onlySemantic}</strong> listing{onlySemantic !== 1 ? 's' : ''} that keyword search missed entirely (highlighted with a dot).
          </div>
        </div>
      </div>
    </SlideShell>
  );
}

function CompactRow({ rank, item, score, accent, unique }) {
  const color = accent === 'emerald' ? 'text-emerald-600' : 'text-indigo-600';
  const barColor = accent === 'emerald' ? 'emerald' : 'indigo';
  return (
    <div className="bg-white rounded-lg border border-slate-200 p-3 animate-scanIn" style={{ animationDelay: `${rank*60}ms` }}>
      <div className="flex items-center justify-between gap-2">
        <div className="flex items-center gap-2 min-w-0">
          <span className="flex-none w-5 h-5 rounded bg-slate-800 text-white text-xs font-bold grid place-items-center">{rank}</span>
          {unique && <span className={`flex-none w-2 h-2 rounded-full ${accent === 'emerald' ? 'bg-emerald-500' : 'bg-indigo-500'}`} title="Unique to this engine" />}
          <span className="text-sm font-medium text-slate-700 truncate">{item.title}</span>
        </div>
        <span className={`flex-none text-sm font-bold ${color}`}>{score}%</span>
      </div>
      <div className="mt-2"><ScoreBar score={score} color={barColor} delay={rank*60} /></div>
    </div>
  );
}

const SLIDES = [
  { title: 'Title & Intro', render: () => <SlideTitle /> },

/* ============================================================
   6. APP SHELL + NAVIGATION
   ============================================================ */
function App() {
  const [i, setI] = useState(0);
  const next = () => setI((v) => Math.min(SLIDES.length - 1, v + 1));
  const prev = () => setI((v) => Math.max(0, v - 1));

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="h-full flex flex-col bg-gradient-to-b from-slate-50 to-slate-100">
      {/* progress dots */}
      <div className="flex-none flex items-center justify-center gap-2 pt-4">
        {SLIDES.map((s, idx) => (
          <button
            key={idx}
            onClick={() => setI(idx)}
            title={s.title}
            className={`h-1.5 rounded-full transition-all ${idx === i ? 'w-8 bg-indigo-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}`}
          />
        ))}
      </div>

      {/* slide body */}
      <main className="flex-1 overflow-hidden py-4">
        {SLIDES[i].render()}
      </main>

      {/* nav bar */}
      <footer className="flex-none border-t border-slate-200 bg-white/70 backdrop-blur px-6 py-3 flex items-center justify-between">
        <button
          onClick={prev} disabled={i === 0}
          className="px-5 py-2 rounded-lg font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >← Previous</button>

        <div className="text-center">
          <div className="text-sm font-semibold text-slate-700">{SLIDES[i].title}</div>
          <div className="text-xs text-slate-400">Slide {i + 1} of {SLIDES.length} · <span className="text-slate-500">Obsidian Software</span></div>
        </div>

        <button
          onClick={next} disabled={i === SLIDES.length - 1}
          className="px-5 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >{i === SLIDES.length - 1 ? 'Done' : 'Next →'}</button>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
