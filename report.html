/* ---------- HELPERS ---------- */
const personaColor = (k)=>({beginner:'emerald',advanced:'indigo',marketer:'rose',learning:'amber',uiux:'violet'}[k]);
const personaName  = (k)=>({beginner:'Beginner',advanced:'Advanced',marketer:'Marketer',learning:'Learning Design',uiux:'UI/UX'}[k]);

function Badge({children}){
  const tones={High:'bg-rose-100 text-rose-700',Med:'bg-amber-100 text-amber-700',Small:'bg-emerald-100 text-emerald-700',Large:'bg-violet-100 text-violet-700'};
  return <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${tones[children]||'bg-slate-100 text-slate-600'}`}>{children}</span>;
}
function Chip({k}){
  const c=personaColor(k);
  return <span className={`text-[10px] font-medium px-1.5 py-0.5 rounded bg-${c}-50 text-${c}-700 border border-${c}-100`}>{personaName(k)}</span>;
}

            </div>
          ))}
          {rows.length===0&&<div className="text-center text-slate-400 py-10">No items match those filters.</div>}
        </div>
      </div>
    </section>
  );
}

function Roadmap(){
  const cols=[
    {k:'Now',  sub:'Quick wins — small effort, high payoff', c:'emerald', tag:'⚡'},
    {k:'Next', sub:'Medium effort — teaching + selling depth', c:'indigo', tag:'🛠️'},
    {k:'Later',sub:'Ambitious / wow', c:'violet', tag:'🚀'},
  ];
  return (
    <section id="roadmap" className="max-w-5xl mx-auto px-6 py-12">
      <h2 className="text-2xl font-bold text-slate-900 mb-1">Project Goals &amp; Roadmap</h2>
      <p className="text-slate-500 mb-6 text-sm">Most of <strong>Now</strong> and much of <strong>Next</strong> shipped in the follow-up pass; the remainder is below.</p>
      <div className="grid md:grid-cols-3 gap-5">
        {cols.map(col=>(
          <div key={col.k} className={`rounded-2xl border-2 border-${col.c}-200 bg-${col.c}-50/40 p-5`}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xl">{col.tag}</span>
              <h3 className={`text-lg font-bold text-${col.c}-700`}>{col.k}</h3>
            </div>
            <p className="text-xs text-slate-500 mb-4">{col.sub}</p>
            <ul className="space-y-2.5">
              {ROADMAP[col.k].map((g,i)=>(
                <li key={i} className="text-sm text-slate-700 flex gap-2">
                  <span className={`flex-none mt-1 w-1.5 h-1.5 rounded-full bg-${col.c}-500`}></span>{g}
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>
    </section>
  );
}

function Vision(){
  return (
    <section id="vision" className="bg-white border-t border-slate-200">
      <div className="max-w-5xl mx-auto px-6 py-14">
        <div className="rounded-2xl bg-gradient-to-br from-slate-900 to-indigo-900 text-white p-8 md:p-10">
          <h2 className="text-xl font-bold text-indigo-300 mb-3">★ North-Star Vision</h2>
          <p className="text-lg leading-relaxed text-slate-100">
            A single, shareable file that a complete beginner finishes feeling they truly <em>understand</em> why semantic search finds intent —
            not just that it does — while a CS student leaves respecting the precision of its framing and an enterprise buyer leaves with
            Obsidian Software's name, proof of impact, and a one-click way to book a conversation.
          </p>
          <p className="mt-4 text-2xl font-bold bg-gradient-to-r from-indigo-300 to-violet-300 bg-clip-text text-transparent">
            It teaches brilliantly and sells credibly — because the same radical transparency is what makes both the lesson and the brand trustworthy.
          </p>
        </div>
        <p className="text-center text-xs text-slate-400 mt-8">Synthesized from a 5-persona multi-agent review (Round 2) · Obsidian Software</p>
      </div>
    </section>
  );
}

function App(){
  return (<div><Hero/><Nav/><Progress/><PersonaCards/><Themes/><Backlog/><Roadmap/><Vision/></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
